# Render Blueprint for the Vela API (https://render.com/docs/blueprint-spec).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: vela-api
    runtime: node
    # Free instance (sleeps after ~15 min idle). Remove or change to upgrade.
    plan: free
    # Closest Render region to India.
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CLIENT_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
